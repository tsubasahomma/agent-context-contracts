# Optional Codex entrypoint example.
# This file is TOML-compatible example content, not a required portable baseline.
# It is not asserted to be supported runtime configuration for every Codex
# version or environment.
#
# Durable operating-contract rules belong in:
# - AGENTS.md
# - docs/agent-context/README.md
# - materialized docs/project/** files when present
#
# Keep repository-local facts and supported local tool settings in the
# consumer-owned project extension or local configuration.

[agent_context]
portable_entrypoint = "AGENTS.md"
portable_contract_index = "docs/agent-context/README.md"
project_extension_path = "docs/project"
read_project_extension_when_present = true
report_missing_project_extension = true

[agent_context.boundaries]
installation_is_optional = true
payload_is_portable_doctrine = false
allow_unowned_destination_overwrite = false
